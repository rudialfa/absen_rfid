name: absensi
description: Aplikasi absensi sekolah (project uji coba).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Core milikmu (versi tidak diubah)
  cupertino_icons: ^1.0.2
  dotted_border: ^2.1.0
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  image_picker: ^1.1.2
  intl: ^0.19.0
  cached_network_image: ^3.4.1

  # Tambahan untuk BLoC, datasource, dan penyimpanan token
  bloc: ^9.0.0
  flutter_bloc: ^9.1.0
  dartz: ^0.10.1
  http: ^1.2.0
  flutter_secure_storage: ^9.2.4
  freezed_annotation: ^3.1.0
  build_runner: ^2.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_gen_runner: ^5.14.0
  flutter_lints: ^2.0.0
  freezed: ^3.2.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    # - assets/icons/
    # - assets/icons/alert/

flutter_gen:
  output: lib/core/assets/
  integrations:
    flutter_svg: true